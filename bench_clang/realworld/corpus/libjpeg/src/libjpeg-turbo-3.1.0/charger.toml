[charger]
# libjpeg-turbo public API header. jpeglib.h includes jconfig.h (normally
# generated by CMake) and jmorecfg.h (both shipped) plus jpegint.h / jerror.h
# (private). We synthesize a minimal jconfig.h so the single-header AST
# extraction of the public API succeeds; the private includes are not part of
# the public ABI surface Charger extracts.
api_header = "src/jpeglib.h"
build_flags = []
deps = []
