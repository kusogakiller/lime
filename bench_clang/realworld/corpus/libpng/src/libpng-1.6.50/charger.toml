[charger]
api_header = "png.h"
# libpng's public header (png.h) requires pnglibconf.h, which is normally
# generated by the build system. The source ships a prebuilt copy; we copy it
# next to png.h so the single-header AST extraction can parse the public API.
build_flags = []
deps = ["zlib-1.3.1"]
