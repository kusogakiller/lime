[charger]
# zlib public API umbrella header. zlib ships its public API in `zlib.h`
# (and `zconf.h`); the other `*.h` files in the tree are generated data
# tables (`crc32.h`) or internal headers (`zutil.h`, `deflate.h`, ...) and
# must NOT be used as the API entry point. Corpus config — not charger logic.
api_header = "src/zlib-1.3.1/zlib.h"
build_flags = []
deps = []
